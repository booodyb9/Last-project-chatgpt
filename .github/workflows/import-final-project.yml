name: Import final Riyadh Glass project
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download staged project archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/rg
          base='https://raw.githubusercontent.com/booodyb9/Alriyad-glass-work-netlify-/main/.upload2'
          for f in y00 y01 y02 y03 y04 y05 y06 y07 y08_09 y10_11 y12_13 y14_15 y16_17 y18_19 y20_21 y22_23; do
            curl -fsSL "$base/$f" -o "/tmp/rg/$f" || true
          done
          cat /tmp/rg/y00 /tmp/rg/y01 /tmp/rg/y02 /tmp/rg/y03 /tmp/rg/y04 /tmp/rg/y05 /tmp/rg/y06 /tmp/rg/y07 /tmp/rg/y08_09 /tmp/rg/y10_11 /tmp/rg/y12_13 /tmp/rg/y14_15 /tmp/rg/y16_17 /tmp/rg/y18_19 /tmp/rg/y20_21 /tmp/rg/y22_23 2>/dev/null | tr -d '\n\r' > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          xz -t /tmp/project.tar.xz
      - name: Replace repository with project
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/project.tar.xz -C .
          rm -rf .upload .upload2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy final Riyadh Glass project' || exit 0
          git push
# trigger import
