name: Restore and verify complete Riyadh Glass project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-complete-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild reviewed project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rg-parts /tmp/rg-project
          base='https://raw.githubusercontent.com/booodyb9/Alriyad-glass-work-netlify-/main/.upload2'
          parts=(y00 y01 y02 y03 y04 y05 y06 y07 y08_09 y10_11 y12_13 y14_15 y16_17 y18_19 y20_21 y22_23)
          for f in "${parts[@]}"; do
            echo "Downloading $f"
            curl --fail --location --retry 3 --retry-delay 2 "$base/$f" -o "/tmp/rg-parts/$f"
            test -s "/tmp/rg-parts/$f"
          done
          cat $(printf '/tmp/rg-parts/%s ' "${parts[@]}") | tr -d '\n\r' > /tmp/rg-project.b64
          base64 --decode /tmp/rg-project.b64 > /tmp/rg-project.tar.xz
          xz --test /tmp/rg-project.tar.xz
          tar -xJf /tmp/rg-project.tar.xz -C /tmp/rg-project

      - name: Validate complete source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/rg-project/package.json
          test -f /tmp/rg-project/index.html
          test -f /tmp/rg-project/src/main.tsx
          test -f /tmp/rg-project/src/App.tsx
          test -f /tmp/rg-project/server/ai-core.js
          test -f /tmp/rg-project/netlify/functions/ai.mjs
          echo 'Required project files are present.'

      - name: Add Netlify production configuration
        shell: bash
        run: |
          cat > /tmp/rg-project/netlify.toml <<'EOF'
          [build]
            command = "npm run build"
            publish = "dist"
            functions = "netlify/functions"

          [build.environment]
            NODE_VERSION = "22"

          [[redirects]]
            from = "/api/*"
            to = "/.netlify/functions/ai/:splat"
            status = 200

          [[redirects]]
            from = "/*"
            to = "/index.html"
            status = 200
          EOF
          printf '\n.netlify/\n' >> /tmp/rg-project/.gitignore

      - name: Install and build before publishing source
        working-directory: /tmp/rg-project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f dist/index.html

      - name: Replace repository only after successful build
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rg-project/. .
          rm -rf node_modules dist .netlify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore complete verified Riyadh Glass project'
          git push
