name: Restore final project
on:
  push:
    branches: [main]
    paths:
      - 'riyadh-glass-production-fixed.zip'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository with reviewed final project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rg-final
          mkdir -p /tmp/rg-final
          unzip -q riyadh-glass-production-fixed.zip -d /tmp/rg-final
          test -f /tmp/rg-final/package.json
          test -f /tmp/rg-final/src/App.tsx
          test -f /tmp/rg-final/server/ai-core.js
          test -f /tmp/rg-final/netlify/functions/ai.mjs
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rg-final/. .
          rm -f riyadh-glass-production-fixed.zip
          rm -f .github/workflows/restore-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore complete reviewed Riyadh Glass project'
          git push
