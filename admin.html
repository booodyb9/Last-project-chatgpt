<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vision Glass CMS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:#f1f5f9;color:#0f172a}.wrap{max-width:1250px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 8px 30px #0000000b}.login{max-width:430px;margin:10vh auto}.h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav button,.btn{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.nav button.active,.btn.primary{background:#2563eb;color:#fff;border-color:#2563eb}.danger{background:#fee2e2!important;color:#991b1b!important;border-color:#fecaca!important}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}.fields{display:grid;gap:10px}.fields label{font-weight:700;font-size:13px}.fields input,.fields textarea,.fields select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.fields textarea{min-height:120px}.records{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc}.muted{color:#64748b}.hidden{display:none}.toast{position:fixed;left:20px;bottom:20px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:12px 16px;background:#eff6ff;border-radius:12px}.top{margin-bottom:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div id="login" class="panel login"><h1>لوحة تحكم Vision Glass</h1><p class="muted">تسجيل الدخول مخصص للمستخدمين المصرح لهم فقط.</p><div class="fields"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password"></label><button class="btn primary" id="loginBtn">دخول</button></div><p id="loginMsg" class="muted"></p></div>
<div id="app" class="hidden"><div class="panel top"><div class="h"><div><h1>CMS — Vision Glass</h1><p class="muted">إدارة المحتوى بدون تغيير تصميم النسخة المؤرشفة أو مخطط قاعدة البيانات.</p></div><button class="btn danger" id="logout">تسجيل الخروج</button></div><div class="stats" id="stats"></div></div>
<div class="nav" id="nav"></div><div class="grid"><div class="panel"><div class="h"><h2 id="editorTitle">إضافة</h2><button class="btn" id="newBtn">جديد</button></div><form id="form" class="fields"></form><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="saveBtn" type="button">حفظ</button><button class="btn danger" id="deleteBtn" type="button">حذف</button></div></div><div class="panel"><div class="h"><h2 id="listTitle">المحتوى</h2><button class="btn" id="refresh">تحديث</button></div><div id="records" class="records"></div></div></div></div></div><div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://ugvdoabczcnxluzxehga.supabase.co','sb_publishable_IgaHjtDYgW9UKVMDgH6EKA_qzBa22pl');
const configs={
services:{label:'الخدمات',table:'services',fields:[['title','العنوان','text'],['slug','الرابط','text'],['short_description','الوصف المختصر','textarea'],['description','الوصف الكامل','textarea'],['icon','الأيقونة','text'],['image','الصورة URL','text'],['features','المميزات JSON','json'],['sort_order','الترتيب','number'],['visible','ظاهر','boolean']]},
projects:{label:'أعمالنا',table:'projects',fields:[['title','العنوان','text'],['slug','الرابط','text'],['location','الموقع','text'],['year','السنة','text'],['category','التصنيف','text'],['client','العميل','text'],['area','المساحة','text'],['short_description','الوصف المختصر','textarea'],['description','الوصف الكامل','textarea'],['cover_image','صورة الغلاف URL','text'],['images','صور المشروع JSON','json'],['featured','مميز','boolean'],['sort_order','الترتيب','number'],['visible','ظاهر','boolean']]},
blog_posts:{label:'المقالات',table:'blog_posts',fields:[['title','العنوان','text'],['slug','الرابط','text'],['excerpt','المقتطف','textarea'],['content','المحتوى JSON','json'],['cover_image','صورة الغلاف URL','text'],['author','الكاتب','text'],['category','التصنيف','text'],['tags','الوسوم JSON','json'],['reading_time','وقت القراءة','number'],['published','منشور','boolean'],['published_at','تاريخ النشر','text'],['sort_order','الترتيب','number']]},
gallery_images:{label:'المعرض الحالي + مصدر السلايدر الإضافي',table:'gallery_images',fields:[['title','العنوان','text'],['alt','Alt SEO','text'],['image','الصورة URL','text'],['category','التصنيف','text'],['sort_order','الترتيب','number'],['visible','ظاهر','boolean']]},
hero_slides:{label:'Hero Slider',table:'hero_slides',fields:[['title','العنوان','text'],['subtitle','العنوان الفرعي','text'],['description','الوصف','textarea'],['image','الصورة URL','text'],['primary_cta_label','زر أساسي','text'],['primary_cta_link','رابط أساسي','text'],['secondary_cta_label','زر ثانوي','text'],['secondary_cta_link','رابط ثانوي','text'],['sort_order','الترتيب','number'],['visible','ظاهر','boolean']]},
pages:{label:'SEO والصفحات',table:'pages',fields:[['slug','الرابط','text'],['title','العنوان','text'],['description','الوصف','textarea'],['seo_title','SEO Title','text'],['seo_description','SEO Description','textarea'],['seo_keywords','الكلمات JSON','json'],['og_image','OG Image URL','text'],['visible','ظاهر','boolean']]},
sections:{label:'أقسام الموقع',table:'sections',fields:[['page_slug','الصفحة','text'],['block_type','نوع القسم','text'],['sort_order','الترتيب','number'],['visible','ظاهر','boolean'],['data','بيانات القسم JSON','json']]},
media:{label:'الصور والوسائط',table:'media',fields:[['name','الاسم','text'],['url','URL','text'],['storage_path','Storage path','text'],['type','النوع','text'],['alt_text','Alt','text'],['title','العنوان','text'],['caption','الوصف','textarea']]},
contents:{label:'النصوص العامة',table:'contents',fields:[['key','المفتاح','text'],['title','العنوان','text'],['body','النص','textarea'],['type','النوع','text']]}
};
let current='services',editing=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function cfg(){return configs[current]}
function input(f,v){const [k,l,t]=f;if(t==='boolean')return '<label>'+l+'<select data-k="'+k+'"><option value="true" '+(v===true?'selected':'')+'>نعم</option><option value="false" '+(v!==true?'selected':'')+'>لا</option></select></label>';return '<label>'+l+(t==='textarea'||t==='json'?'<textarea data-k="'+k+'">'+esc(t==='json'?JSON.stringify(v??[],null,2):(v??''))+'</textarea>':'<input data-k="'+k+'" type="'+(t==='number'?'number':'text')+'" value="'+esc(v??'')+'">')+'</label>'}
function renderForm(row={}){document.getElementById('editorTitle').textContent=editing?'تعديل':'إضافة';document.getElementById('form').innerHTML=cfg().fields.map(f=>input(f,row[f[0]])).join('')}
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return false;const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();return !!data}
async function login(){const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginMsg.textContent='فشل الدخول: '+error.message;return}if(!await isAdmin()){await sb.auth.signOut();loginMsg.textContent='هذا الحساب ليس Admin.';return}showApp()}
async function showApp(){login.classList.add('hidden');app.classList.remove('hidden');nav.innerHTML=Object.entries(configs).map(([k,c])=>'<button data-k="'+k+'">'+c.label+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.k));await select(current);loadStats()}
async function select(k){current=k;editing=null;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.k===k));listTitle.textContent=cfg().label;renderForm();await list()}
async function list(){records.innerHTML='جارٍ التحميل...';const {data,error}=await sb.from(cfg().table).select('*').order('id',{ascending:false}).limit(100);if(error){records.textContent=error.message;return}records.innerHTML=(data||[]).map(r=>'<div class="row"><div><b>'+esc(r.title||r.name||r.key||r.slug||('ID '+r.id))+'</b><div class="muted">ID: '+esc(r.id)+'</div></div><button class="btn" data-id="'+esc(r.id)+'">تعديل</button></div>').join('')||'<p class="muted">لا توجد سجلات.</p>';records.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>edit(b.dataset.id,data))}
function edit(id,data){const r=data.find(x=>String(x.id)===String(id));editing=r;renderForm(r)}
async function save(){const c=cfg(),payload={};document.querySelectorAll('#form [data-k]').forEach(el=>{const k=el.dataset.k,t=c.fields.find(x=>x[0]===k)[2];let v=el.value;if(t==='boolean')v=v==='true';if(t==='number')v=v===''?0:Number(v);if(t==='json'){try{v=JSON.parse(v||'[]')}catch(e){throw Error('JSON غير صالح في '+k)}}payload[k]=v});let q;if(editing)q=await sb.from(c.table).update(payload).eq('id',editing.id);else q=await sb.from(c.table).insert(payload);if(q.error){toast(q.error.message);return}toast('تم الحفظ');editing=null;renderForm();await list();loadStats()}
async function del(){if(!editing)return;if(!confirm('تأكيد الحذف؟'))return;const {error}=await sb.from(cfg().table).delete().eq('id',editing.id);if(error){toast(error.message);return}toast('تم الحذف');editing=null;renderForm();await list();loadStats()}
async function loadStats(){const out=[];for(const c of Object.values(configs)){const {count}=await sb.from(c.table).select('*',{count:'exact',head:true});out.push('<div class="stat"><b>'+c.label+'</b>: '+(count??0)+'</div>')}stats.innerHTML=out.join('')}
loginBtn.onclick=login;saveBtn.onclick=()=>save().catch(e=>toast(e.message));deleteBtn.onclick=del;newBtn.onclick=()=>{editing=null;renderForm()};refresh.onclick=list;logout.onclick=()=>sb.auth.signOut().then(()=>location.reload());sb.auth.getSession().then(async({data})=>{if(data.session&&await isAdmin())showApp()});
</script></body></html>
